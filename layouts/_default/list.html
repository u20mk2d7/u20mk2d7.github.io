{{ define "main" }}
<h2>All Articles</h2>

<ul style="list-style-type: none; padding-left: 0;">
  {{ range .Pages }}
    <li style="margin-bottom: 12px;">
      <span class="meta">{{ .Date.Format "2006-01-02" }}</span> — 
      <a href="{{ .RelPermalink }}"><strong>{{ .Title }}</strong></a>
      
      {{ if .Params.tags }}
        <span class="tags" style="margin-left: 8px;">
          {{ range .Params.tags }}
            <a href="/tags/{{ . | urlize }}/">#{{ . }}</a>
          {{ end }}
        </span>
      {{ end }}
    </li>
  {{ end }}
</ul>
{{ end }}
