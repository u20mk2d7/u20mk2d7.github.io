
baseURL = 'https://u20mk2d7.github.io/'
locale = 'en-us'
title = 'keep moving forward'

[taxonomies]
  tag = 'tags'

[security]
  allowContent = ['^text/html$']

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true

  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

